<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NOT A GOOD — I’ll Still Have Myself</title>
  <meta name="description" content="A minimalist cinematic typographic poem about solitude, expectations, and self-acceptance.">
  <meta name="theme-color" content="#050608">

  <!-- Google Fonts: Cormorant Garamond & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Atmospheric Background Media Layer (Carousel & Video) -->
  <div class="background-media-container" id="bgMediaContainer">
    <!-- Carousel of 4 photos for Act I (up to "not a good person") -->
    <div class="photo-carousel" id="photoCarousel">
      <div class="carousel-slide active" style="background-image: url('photoes/image.png');"></div>
      <div class="carousel-slide" style="background-image: url('photoes/image%20copy.png');"></div>
      <div class="carousel-slide" style="background-image: url('photoes/image%20copy%202.png');"></div>
      <div class="carousel-slide" style="background-image: url('photoes/image%20copy%203.png');"></div>
    </div>

    <!-- Cinematic Video Layer (Reveals when "person." hits, plays under the narrative) -->
    <video class="bg-video" id="bgVideo" playsinline muted loop preload="auto">
      <source src="Untitled%20design.mp4" type="video/mp4">
      <source src="Untitled design.mp4" type="video/mp4">
    </video>

    <!-- Dark Cinematic Vignette Overlay -->
    <div class="media-overlay"></div>
  </div>

  <!-- Subtle Atmospheric Stardust Canvas (No boundaries) -->
  <canvas class="particles-layer" id="particlesCanvas"></canvas>

  <!-- Film Grain Texture -->
  <div class="film-grain"></div>

  <!-- Main Fullscreen Stage: Pure Text Only -->
  <main class="text-stage" id="textStage">
    
    <!-- ACT I: Centered Statement (Zero Movement in NOT A GOOD) -->
    <div class="kinetic-statement" id="kineticStatement">
      <span class="static-prefix" id="staticPrefix">NOT A GOOD</span>
      <span class="word-slot">
        <span class="role-text" id="roleText" data-text="son.">son.</span>
      </span>
    </div>

    <!-- ACT II & III: Narrative Passage -->
    <div class="passage-statement hidden" id="passageStatement">
      <h1 class="passage-main" id="passageMain">But maybe that’s okay.</h1>
      <p class="passage-sub hidden" id="passageSub"></p>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
